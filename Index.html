<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardWare: comparaçãa BR</title>
    <link rel="stylesheet" href="Estilo.css">
</head>
<body>
    <header>
        <h1>Hardware info BR</h1>
        <div class="filter-container">
            <button class="filter-btn" id="gpu-filter-btn" onclick="toggleGpuFilters()">
                <img src="https://img.icons8.com/ios-filled/50/video-card.png" alt="Ícone de GPU">
                <span>GPU</span>
            </button>
            <button class="filter-btn" onclick="toggleCpuFilters()">
                <img src="https://img.icons8.com/ios/50/processor.png" alt="Ícone de CPU">
                <span>CPU</span>
            </button>
        </div>
        <!-- Sub-filtros de GPU (inicialmente escondidos) -->
        <div id="gpu-sub-filters" class="sub-filter-container hidden">
            <div class="sub-filter-group">
                <label for="fabricante-filter">Fabricante</label>
                <select id="fabricante-filter" onchange="atualizarFiltrosGPU()"></select>
            </div>
            <div class="sub-filter-group">
                <label for="tipo-memoria-filter">Tipo de Memória</label>
                <select id="tipo-memoria-filter" onchange="atualizarFiltrosGPU()"></select>
            </div>
            <div class="sub-filter-group">
                <label for="quantidade-memoria-filter">Quantidade</label>
                <select id="quantidade-memoria-filter" onchange="atualizarFiltrosGPU()"></select>
            </div>
        </div>
        <!-- Sub-filtros de CPU (inicialmente escondidos) -->
        <div id="cpu-sub-filters" class="sub-filter-container hidden">
            <div class="sub-filter-group">
                <label for="cpu-fabricante-filter">Fabricante</label>
                <select id="cpu-fabricante-filter" onchange="atualizarFiltrosCPU()"></select>
            </div>
        </div>
        <div>
            <input type="text" id="input-busca" placeholder="Procurar por HardWare">
            <button id="botao-busca" onclick="iniciarBusca()">Buscar</button>
        </div>
    </header>
    <div class="main-container">
        <main>
            <section class="card-container">
                <!-- Cards serão renderizados aqui pelo JavaScript -->
            </section>
        </main>
        <aside id="details-panel" class="details-panel">
            <!-- Conteúdo dos detalhes será renderizado aqui -->
            <button id="close-details-btn" class="close-btn">&times;</button>
            <div id="details-content" class="details-content-placeholder">
                <p>Selecione um produto para ver os detalhes</p>
            </div>
        </aside>
    </div>
    <footer class="footer">
        <ul class="footer-links"><li><a href="https://github.com/DarkStellas">Desenvolvedor do Site</a></li></ul>
    </footer>
    <!-- O arquivo logicaFiltros.js não é mais necessário, a lógica está em Script.js -->
    <script src="Script.js"></script>
</body>
</html>
